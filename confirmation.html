<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order confirmed — ShopNest</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="confirmation-wrap"><div class="confirmation-card"><div class="success-mark">✓</div><span class="eyebrow">ORDER PLACED</span><h1>That's in the bag<span class="heading-dot">.</span></h1><p>Your demo order has been saved successfully.</p><div class="order-number">ORDER #<strong th:text="${order.id}">100</strong></div><div class="confirmation-details"><div><span>Order total</span><strong th:text="${'₹' + #numbers.formatDecimal(order.total,1,'COMMA',2,'POINT')}">₹0</strong></div><div><span>Delivery address</span><strong th:text="${order.deliveryAddress}">Address</strong></div><div><span>Items</span><strong th:text="${order.items.size()}">0</strong></div></div><p class="tiny-note">This is an academic demo. No payment was collected and no parcel will be dispatched.</p><a class="button button-dark" th:href="@{/}">Back to the shop →</a></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
