<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — ShopNest</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="auth-wrap"><div class="auth-card"><span class="eyebrow">MAKE IT YOURS</span><h1>Create account<span class="heading-dot">.</span></h1><p class="muted">Just the basics, then you're ready to shop.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}" class="stack-form"><label>Full name<input type="text" name="fullName" th:value="${fullName}" required minlength="2" maxlength="80" autocomplete="name"></label><label>Email address<input type="email" name="email" th:value="${email}" required maxlength="120" autocomplete="email"></label><label>Password <span class="muted">(8 characters minimum)</span><input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><button class="button button-dark full-button" type="submit">Create my account</button></form><p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
