<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — ShopNest</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in<span class="heading-dot">.</span></h1><p class="muted">Pick up where you left off.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/login}" class="stack-form"><label>Email address<input type="email" name="email" th:value="${email}" required maxlength="120" autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-dark full-button" type="submit">Sign in</button></form><p class="auth-switch">New to ShopNest? <a th:href="@{/register}">Create an account</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
