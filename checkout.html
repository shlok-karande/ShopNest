<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — ShopNest</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="content-page"><span class="eyebrow">ALMOST THERE</span><h1>Checkout<span class="heading-dot">.</span></h1><div class="alert" th:if="${error}" th:text="${error}"></div><div class="cart-layout"><section class="checkout-card"><h2>Delivery details</h2><p class="muted">Use a demo address for your project presentation.</p><form method="post" th:action="@{/checkout}" class="stack-form"><label>Delivery address<textarea name="address" required minlength="8" maxlength="500" rows="4" placeholder="Flat, street, area, city, PIN code"></textarea></label><button class="button button-dark full-button" type="submit">Place demo order →</button></form><p class="tiny-note">This project does not collect or process payment details.</p></section><aside class="summary-card"><span class="eyebrow">YOUR ORDER</span><div class="order-mini" th:each="line : ${lines}"><span th:text="${line.product.name + ' × ' + line.quantity}">Item × 1</span><strong th:text="${'₹' + #numbers.formatDecimal(line.subtotal(),1,'COMMA',2,'POINT')}">₹0</strong></div><hr><div class="summary-line summary-total"><span>Total</span><strong th:text="${'₹' + #numbers.formatDecimal(total,1,'COMMA',2,'POINT')}">₹0</strong></div></aside></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
