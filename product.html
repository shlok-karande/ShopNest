<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${product.name + ' — ShopNest'}">Product — ShopNest</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: header}"></div><main class="detail-page"><a class="back-link" th:href="@{/}">← Back to the shop</a><div class="detail-layout"><div class="detail-image"><img th:src="${product.imageUrl}" th:alt="${product.name}"></div><section class="detail-info"><span class="eyebrow" th:text="${product.category + ' / SHOPNEST EDIT'}">Category</span><h1 th:text="${product.name}">Product name</h1><p class="detail-price" th:text="${'₹' + #numbers.formatDecimal(product.price,1,'COMMA',2,'POINT')}">₹0</p><p class="detail-description" th:text="${product.description}">Description</p><ul class="feature-list"><li>✓ Carefully selected for everyday use</li><li>✓ Clear pricing, no hidden demo fees</li><li>✓ Secure order records for this local demo</li></ul><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><button class="button button-dark full-button" type="submit">Add to bag <span>＋</span></button></form><p class="tiny-note">Academic demonstration only. No payment will be collected.</p></section></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
